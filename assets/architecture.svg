          <circle cx="24" cy="28" r="8" fill="#00B4D8" />
          <text x="40" y="33" fill="#F0F6FC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">Client Browser</text>
          <rect x="15" y="55" width="155" height="1" fill="#30363D"/>
          <text x="15" y="76" fill="#8B949E" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">HTML5 Canvas / WebSocket</text>
        </g>
        
        
        <g>
          <line x1="235" y1="170" x2="255" y2="170" stroke="#FF7139" stroke-width="2.5" stroke-dasharray="4,4" />
          <polygon points="255,166 262,170 255,174" fill="#FF7139" />
        </g>
        
        <g transform="translate(260, 120)">
          <rect width="185" height="100" rx="12" fill="#161B22" stroke="#46E3B7" stroke-width="2" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))"/>
          <circle cx="24" cy="28" r="8" fill="#46E3B7" />
          <text x="40" y="33" fill="#F0F6FC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">Render Service</text>
          <rect x="15" y="55" width="155" height="1" fill="#30363D"/>
          <text x="15" y="76" fill="#8B949E" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">websockify (Port $PORT)</text>
        </g>
        
        
        <g>
          <line x1="445" y1="170" x2="465" y2="170" stroke="#FF7139" stroke-width="2.5" stroke-dasharray="4,4" />
          <polygon points="465,166 472,170 465,174" fill="#FF7139" />
        </g>
        
        <g transform="translate(470, 120)">
          <rect width="185" height="100" rx="12" fill="#161B22" stroke="#9D4EDD" stroke-width="2" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))"/>
          <circle cx="24" cy="28" r="8" fill="#9D4EDD" />
          <text x="40" y="33" fill="#F0F6FC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">x11vnc Server</text>
          <rect x="15" y="55" width="155" height="1" fill="#30363D"/>
          <text x="15" y="76" fill="#8B949E" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Display :1 (RFB 5900)</text>
        </g>
        
        
        <g>
          <line x1="655" y1="170" x2="675" y2="170" stroke="#FF7139" stroke-width="2.5" stroke-dasharray="4,4" />
          <polygon points="675,166 682,170 675,174" fill="#FF7139" />
        </g>
        
        <g transform="translate(680, 120)">
