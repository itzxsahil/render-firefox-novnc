          <circle cx="24" cy="28" r="8" fill="#FF7139" />
          <text x="40" y="33" fill="#F0F6FC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">Firefox Native</text>
          <rect x="15" y="55" width="155" height="1" fill="#30363D"/>
          <text x="15" y="76" fill="#8B949E" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Low Memory / IPv4 DNS</text>
        </g>
        
