<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="100%" height="270">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7139" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#388BFD" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="270" rx="16" fill="url(#bgGrad)" stroke="#30363D" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <rect x="25" y="20" width="8" height="28" rx="4" fill="#FF7139" />
  <text x="45" y="40" fill="#FFFFFF" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">Render Firefox noVNC Desktop Architecture</text>
  <text x="45" y="60" fill="#8B949E" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Native Firefox Container • noVNC Web UI • IPv6 Fix</text>

  <!-- Decorative Badge -->
  <rect x="760" y="24" width="115" height="24" rx="12" fill="#21262D" stroke="#FF7139" stroke-width="1"/>
  <text x="817" y="40" fill="#FF7139" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LIVE PROTOCOL</text>

  <!-- Architecture Flow Nodes -->
  
        
        <g transform="translate(50, 120)">
